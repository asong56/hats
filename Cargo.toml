[package]
name = "hats"
version = "0.2.0"
edition = "2021"
description = "Ultra-fast CLI hosts manager powered by YAML — a keyboard-driven alternative to SwitchHosts"
license = "MIT"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
