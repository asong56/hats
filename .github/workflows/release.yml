name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0-alpha)"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            bin_name: redew.exe
            asset_name: redew-windows-amd64.zip
          - os: macos-latest
            goos: darwin
            goarch: arm64
            bin_name: redew
            asset_name: redew-macos-arm64.zip
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            bin_name: redew
            asset_name: redew-linux-amd64.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify frontend assets are present
        shell: bash
        run: test -f backend/internal/web/dist/index.html

      - name: Tidy Go modules
        shell: bash
        working-directory: backend
        run: go mod tidy

      - name: Run backend tests
        shell: bash
        working-directory: backend
        run: go test ./...

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        shell: bash
        working-directory: backend
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../build
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
            -o "../build/${{ matrix.bin_name }}" \
            ./cmd/redew

      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist
          cd build
          zip -j "../dist/${{ matrix.asset_name }}" "${{ matrix.bin_name }}" ../README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          mkdir -p dist
          find artifacts -type f -name "*.zip" -exec cp {} dist/ \;
          cd dist
          sha256sum ./*.zip > checksums.txt
          ls -lh .

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.value }}" ./dist/*.zip ./dist/checksums.txt \
            --draft --generate-notes --title "Redew ${{ steps.tag.outputs.value }}"
